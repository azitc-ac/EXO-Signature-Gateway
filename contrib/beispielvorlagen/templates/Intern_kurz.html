<table cellpadding="0" cellspacing="0" border="0" style="font-family:Calibri, Arial, sans-serif;font-size:10.5pt;color:#1f2937;border-collapse:collapse">
  <tr><td style="padding:0">Viele Grüße</td></tr>
  <tr><td style="padding:0">{{ user.displayName }}</td></tr>
  {% if user.department %}<tr><td style="padding:0;color:#6b7280">{{ user.department }}</td></tr>{% endif %}
  {% if user.phone %}<tr><td style="padding:0">Durchwahl <a href="tel:{{ user.phone }}" style="color:#0369a1;text-decoration:none">{{ user.phone }}</a></td></tr>{% endif %}
</table>
