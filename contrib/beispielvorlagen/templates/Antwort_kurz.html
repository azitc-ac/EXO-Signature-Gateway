<table cellpadding="0" cellspacing="0" border="0" style="font-family:Calibri, Arial, sans-serif;font-size:10.5pt;color:#1f2937;border-collapse:collapse">
  <tr><td style="padding:0;font-weight:bold">{{ user.displayName }}</td></tr>
  {% if user.jobTitle %}<tr><td style="padding:0;color:#6b7280;font-size:9pt">{{ user.jobTitle }}</td></tr>{% endif %}
  {% if user.phone %}<tr><td style="padding:0;font-size:9pt">Tel. <a href="tel:{{ user.phone }}" style="color:#0369a1;text-decoration:none">{{ user.phone }}</a></td></tr>{% endif %}
</table>
