<svg viewBox="46 36 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EXO Signature Gateway">
<!-- Anmeldeseite: Entwurf D (grosses Bild — Siegel auf der Spitze der Lasche,
     Schloss unten rechts). Bewusst eine eigene Zeichnung; alle kleinen Symbole
     (Favicon, Add-ins, Teams) kommen aus favicon.svg (Entwurf C).

     Einmalige Animation (CSS, läuft auch im <img>): offener Umschlag mit
     Einschub → Brief fliegt hinein → Lasche schliesst → Unterschrift →
     Siegel → Schloss. Das Endbild ist das unbewegte Bild; bei
     prefers-reduced-motion erscheint es sofort. -->
<style>
  .an { transform-box: fill-box; animation-fill-mode: both; }
  #auf     { transform-origin: 50% 100%; animation: weg-y .35s ease-in 1.9s both; }
  #innen-v { animation: aus .01s linear 2.6s both; }
  #brief   { transform-origin: 50% 50%; animation: brief 1.5s cubic-bezier(.25,.8,.35,1) .3s both, aus .15s linear 2.55s both; }
  #einschub { animation: aus .2s linear 2.6s both; }
  #lasche  { transform-origin: 50% 0%; animation: her-y .35s ease-out 2.25s both; }
  #zeilen  { animation: ein .3s ease-out 2.75s both; }
  #unterschrift { stroke-dasharray: 1; animation: zeichnen .9s ease-in-out 2.9s both; }
  #punkt   { transform-origin: 50% 50%; animation: pop .2s ease-out 3.8s both; }
  #siegel  { transform-origin: 50% 50%; animation: pop .45s cubic-bezier(.3,.7,.4,1) 4.05s both; }
  #schloss { transform-origin: 50% 50%; animation: pop .45s cubic-bezier(.3,.7,.4,1) 4.55s both; }
  @keyframes brief {
    0%   { opacity: 0; transform: translate(40px,-120px) rotate(14deg); }
    15%  { opacity: 1; }
    60%  { transform: translate(0,0) rotate(0deg); }
    100% { opacity: 1; transform: translate(0,52px) rotate(0deg); } }
  @keyframes weg-y { from { transform: scaleY(1); } to { transform: scaleY(0); } }
  @keyframes her-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes zeichnen { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes ein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes aus { from { opacity: 1; } to { opacity: 0; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 70% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .an { animation: none !important; } #auf, #innen-v, #brief, #einschub { display: none; } }
</style>
<defs><linearGradient id="e" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4f8ef7"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
<linearGradient id="el" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7fb0ff"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
<radialGradient id="w" cx="38%" cy="32%" r="75%"><stop offset="0%" stop-color="#c0262d"/><stop offset="60%" stop-color="#991b1b"/><stop offset="100%" stop-color="#6b1010"/></radialGradient>
<filter id="sh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.28"/></filter>
<filter id="b" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e293b" flood-opacity="0.3"/></filter><clipPath id="c"><rect x="75" y="90" width="150" height="110" rx="20"/></clipPath><linearGradient id="ev" gradientUnits="userSpaceOnUse" x1="75" y1="90" x2="225" y2="200"><stop offset="0%" stop-color="#4f8ef7"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient><linearGradient id="innen" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient><filter id="bs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e293b" flood-opacity="0.25"/></filter></defs>
<path id="auf" class="an" d="M95,90 L205,90 A20,20 0 0 0 225,70 L150,40 L75,70 A20,20 0 0 0 95,90 Z" fill="url(#el)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
<g filter="url(#sh)"><rect x="75" y="90" width="150" height="110" rx="20" fill="url(#e)"/></g>
<g id="innen-v" class="an" clip-path="url(#c)"><path d="M75,90 L225,90 L150,134 Z" fill="url(#innen)"/></g>
<g id="brief" class="an" filter="url(#bs)"><rect x="92" y="44" width="116" height="86" rx="6" fill="#ffffff"/>
<rect x="104" y="58" width="60" height="5" rx="2.5" fill="#cbd5e1"/><rect x="104" y="70" width="88" height="4" rx="2" fill="#e2e8f0"/>
<rect x="104" y="80" width="80" height="4" rx="2" fill="#e2e8f0"/><rect x="104" y="90" width="84" height="4" rx="2" fill="#e2e8f0"/></g>
<g id="einschub" class="an" clip-path="url(#c)"><path d="M75,90 L150,134 L225,90 L225,200 L75,200 Z" fill="url(#ev)"/>
<path d="M75,90 L150,134 L225,90" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-linejoin="round"/></g>
<g id="lasche" class="an"><g clip-path="url(#c)"><path d="M75,90 L225,90 L150,134 Z" fill="url(#el)" opacity="0.9"/>
<path d="M75,90 L150,134" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/><path d="M225,90 L150,134" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
<ellipse cx="105" cy="107" rx="28" ry="13" fill="#ffffff" opacity="0.12"/></g></g>
<path id="unterschrift" class="an" pathLength="1" d="M105,165 C117,148 125,180 137,160 C145,148 155,176 170,158" fill="none" stroke="#fbbf24" stroke-width="4.4" stroke-linecap="round"/><circle id="punkt" class="an" cx="174" cy="155" r="2.8" fill="#fbbf24"/>
<g id="zeilen" class="an"><rect x="105" y="176" width="72" height="5.5" rx="2.75" fill="#ffffff" opacity="0.55"/><rect x="105" y="188" width="48" height="5.5" rx="2.75" fill="#ffffff" opacity="0.35"/></g>
<g id="schloss" class="an"><g filter="url(#b)"><circle cx="208" cy="192" r="21" fill="url(#l)"/></g>
