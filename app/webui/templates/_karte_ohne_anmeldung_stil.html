{# Stil der eigenständigen Seiten für Postfachinhaber ohne Anmeldung (Zugang über
   ein Einmalmerkmal): einwilligung.html, erneuerung_abwahl.html. Hell und dunkel
   über prefers-color-scheme — diese Seiten laden kein dark-mode.css. #}
  <style>
    :root { --bg:#f1f5f9; --karte:#fff; --text:#1e293b; --leise:#64748b; --rand:#e2e8f0;
            --blau:#0078d4; --gut:#166534; --gutbg:#ecfdf5; --schlecht:#991b1b; --schlechtbg:#fef2f2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --karte:#1e293b; --text:#e2e8f0; --leise:#94a3b8; --rand:#334155;
              --blau:#0284c7; --gut:#86efac; --gutbg:#0f2018; --schlecht:#fca5a5; --schlechtbg:#2a1215; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
           background: var(--bg); color: var(--text); margin: 0; padding: 32px 16px; }
    .karte { max-width: 560px; margin: 0 auto; background: var(--karte); border: 1px solid var(--rand);
             border-radius: 10px; padding: 28px 28px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { line-height: 1.6; }
    .leise { color: var(--leise); font-size: 13px; }
    label.wahl { display: flex; gap: 10px; align-items: flex-start; padding: 12px; margin: 10px 0;
                 border: 1px solid var(--rand); border-radius: 8px; cursor: pointer; line-height: 1.5; }
    label.wahl input { margin-top: 4px; flex-shrink: 0; }
    .knoepfe { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    button { font-size: 15px; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--rand);
             background: var(--karte); color: var(--text); cursor: pointer; }
    button.ja { background: var(--blau); border-color: var(--blau); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .ergebnis { padding: 12px 14px; border-radius: 8px; margin-top: 8px; }
    .ergebnis.gut { background: var(--gutbg); color: var(--gut); }
    .ergebnis.schlecht { background: var(--schlechtbg); color: var(--schlecht); }
  </style>
