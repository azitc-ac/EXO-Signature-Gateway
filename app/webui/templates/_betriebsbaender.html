{# Betriebszustände als Band über jeder Seite: Lernmodus, Bypass, Wartung,
   Zustellfehler, Wächter. Eingebunden in base.html UND einzeln gerendert von
   GET /api/betriebsbaender — so frischt betriebsbaenderAuffrischen() sie nach
   einer Aktion auf, ohne die Seite neu zu laden. Darum hier kein <script>:
   per innerHTML eingesetzt liefe es nicht (bypassPruefen steht in base.html). #}
{# Nur Admins: Bearbeiter können hier nichts tun, und ohne Anmeldung
   (Anmeldeseite!) gilt niemand als Admin — siehe deps._check_auth. #}
{% set _rolle = (request.state.user_role if request.state.user_role is defined else 'admin')
                if request.state.angemeldet is defined and request.state.angemeldet else 'gast' %}
{% if _rolle == 'admin' %}
{# Der Lernmodus ist der einzige Zustand, in dem sich die Relay-Freigabe von
   selbst erweitert. Er gehoert deshalb sichtbar — auf JEDER Seite, nicht
   nur auf der, auf der man ihn eingeschaltet hat. Der Wert kommt aus einem
   Jinja-Global (`webui/deps.py`), damit keine Route ihn vergessen kann. #}
{% set _lern_rest = lernmodus_rest_min() %}
{% if _lern_rest %}
<div id="lernmodus-banner"
     style="background:#fffbeb;border-bottom:2px solid #fcd34d;padding:9px 16px;
            font-size:13px;color:#92400e;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
  <strong>SMTP-Lernmodus läuft</strong>
  <span>Geräte aus dem freigegebenen Bereich dürfen einliefern und werden
    aufgenommen — noch {{ _lern_rest }} Minute{{ '' if _lern_rest == 1 else 'n' }}.</span>
  <a href="/relay" style="color:#92400e;font-weight:700;margin-left:auto">Zur Geräteliste</a>
</div>
{% endif %}

{# Bypass aktiv: ausgehende Post geht ohne Signatur raus. Gehört auf JEDE
   Seite, sonst fällt ein „vergessener" Bypass nicht auf. Global aus deps.py. #}
{% set _bypass = bypass_gemeldet() %}
{% if _bypass %}
<div id="bypass-banner"
     style="background:#fef2f2;border-bottom:2px solid #fca5a5;padding:9px 16px;
            font-size:13px;color:#991b1b;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
  <strong>Ausfallsicherung aktiv (Bypass)</strong>
  <span>Ausgehende Post wird derzeit <strong>ohne Signatur</strong> zugestellt{% if _bypass.seit %} — gemeldet seit {{ _bypass.seit }}{% endif %}.{% if _bypass.geprueft %} Regel zuletzt geprüft: {{ _bypass.geprueft }}.{% endif %}</span>
  <button type="button" class="btn secondary btn-sm" id="bypass-pruefen-btn"
          style="margin-left:auto" onclick="bypassPruefen()">Erneut prüfen</button>
  <span id="bypass-pruefen-msg" class="field-msg" style="margin:0"></span>
</div>
{% endif %}

{# Betriebszustände aus der Übersicht — seit v1.10.87 auf JEDER Seite, wie
   Lernmodus und Bypass. Nur für Admins: die Ziele liegen unter „Erweitert“.
   Globals aus deps.py; keine Route kann sie vergessen. #}
{% set _wartung = wartung_gemeldet() %}
{% if _wartung %}
<div id="wartung-banner"
     style="background:#fffbeb;border-bottom:2px solid #fcd34d;padding:9px 16px;
            font-size:13px;color:#92400e;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
  <strong>Wartungsmodus aktiv</strong>
  <span>Mails werden verarbeitet, aber <strong>nicht zugestellt</strong> —
    {{ _wartung.zurueck }} Mail{{ '' if _wartung.zurueck == 1 else 's' }} zurückgehalten.</span>
  <a href="/advanced#maintenance" style="color:#92400e;font-weight:700;margin-left:auto">Zum Wartungsmodus</a>
</div>
{% endif %}
{% set _zustellfehler = zustellfehler_anzahl() %}
{% if _zustellfehler %}
<div id="zustellfehler-banner"
     style="background:#fef2f2;border-bottom:2px solid #fca5a5;padding:9px 16px;
            font-size:13px;color:#991b1b;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
  <strong>Zustellfehler</strong>
  <span>{{ _zustellfehler }} Mail{{ '' if _zustellfehler == 1 else 's' }} konnte{{ '' if _zustellfehler == 1 else 'n' }}
    nicht zugestellt werden und {{ 'wartet' if _zustellfehler == 1 else 'warten' }} in der Warteschlange.
    Sie werden automatisch erneut zugestellt (erst minütlich, dann alle 5, dann alle 15 Minuten,
    Aufgabe nach 2 Tagen). Bleibt es dauerhaft, prüfe die Zustellwege.</span>
  <a href="/advanced#maintenance" style="color:#991b1b;font-weight:700;margin-left:auto">Zur Warteschlange</a>
</div>
{% endif %}
{# Eigene Exchange-Post an Port 25 abgewiesen (exo_erkennung.merke_abweisung):
   nur Mails mit der Kennung des EIGENEN Tenants — kein Scanner-Rauschen. #}
{% set _exo_ab = exo_abgewiesen_gemeldet() %}
{% if _exo_ab %}
<div id="exo-abgewiesen-banner"
     style="background:#fef2f2;border-bottom:2px solid #fca5a5;padding:9px 16px;
            font-size:13px;color:#991b1b;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
  <strong>Post aus deinem Exchange Online wird abgewiesen</strong>
  <span>{{ _exo_ab.anzahl }} Mail{{ '' if _exo_ab.anzahl == 1 else 's' }} in den letzten
    24 Stunden, zuletzt von {{ _exo_ab.ip }}. Die Absender bekommen eine Unzustellbarkeitsmeldung.
    Häufigste Ursache: eine Firewall, die die Absenderadresse umschreibt.</span>
  <a href="/advanced#quell-ip" style="color:#991b1b;font-weight:700;margin-left:auto">Zur Quell-IP-Prüfung</a>
</div>
{% endif %}
{% set _waechter = waechter_gemeldet() %}
{% if _waechter %}
<div id="waechter-banner"
     style="background:#fef2f2;border-bottom:2px solid #fca5a5;padding:9px 16px;
            font-size:13px;color:#991b1b;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
  {% if _waechter.art == 'exo' %}
  <strong>Bypass-Wächter ohne Exchange-Zugriff</strong>
  <span>Er läuft, kann die Transportregel aber <strong>nicht schalten</strong> — im Ausfall
    gäbe es keinen Bypass. Prüfe die Exchange-Rolle „Transport Rules“.
    Fehler: {{ _waechter.fehler }}. Zuletzt gesehen: {{ _waechter.zuletzt }}.</span>
  {% else %}
  <strong>Bypass-Wächter meldet sich nicht</strong>
  <span>Zuletzt gesehen: {{ _waechter.zuletzt }}. Solange er schweigt, bliebe ein
    Ausfall des Gateways unbemerkt.</span>
  {% endif %}
  <a href="/advanced#watchdog" style="color:#991b1b;font-weight:700;margin-left:auto">Zum Wächter</a>
</div>
{% endif %}
{% endif %}
