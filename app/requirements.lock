# VOLLSTÄNDIG aufgelöster Abhängigkeitsbaum — HIERAUS wird installiert.
#
# WARUM ES DIESE DATEI GIBT
# -------------------------
# requirements.txt pinnt die 11 DIREKT benutzten Pakete exakt. Alles, was nur
# als deren Abhängigkeit mitkommt, blieb dabei frei — und wanderte. Am
# 09.08.2026 gemessen, bei identischer requirements.txt:
#
#   Entwicklungsrechner   starlette 0.41.3
#   Raspi-Container       starlette 1.3.1
#   Azure-VM (produktiv)  starlette 1.4.0
#   CI / frische venv     starlette 1.6.0
#
# Das ist nicht kosmetisch. Ab Starlette 1.4 kopiert include_router() die
# Routen nicht mehr nach app.routes, sondern haengt einen Stellvertreter ein.
# Die Anwendung bedient sie weiterhin korrekt, aber die Routen-Momentaufnahme
# sah sie nicht — CI rot, lokal gruen, und die Ursache lag in einem Paket, das
# niemand je ausgewaehlt hatte.
#
# Ohne diese Datei prueft die CI gegen einen anderen Baum als den, der beim
# Betreiber laeuft. Ein gruener Lauf beweist dann nichts ueber den Betrieb.
#
# HERKUNFT
# --------
# pip freeze aus dem PRODUKTIV laufenden Container der Azure-VM
# (Gateway v1.7.168, 09.08.2026) — also der Stand, der nachweislich Mails
# verarbeitet, und nicht eine frische Aufloesung, die noch niemand im Betrieb
# gesehen hat. Die volle Testsuite lief gegen genau diesen Baum: 483 gruen.
#
# AKTUALISIEREN
# -------------
#   1. gewuenschte Fassung in requirements.txt aendern      (die Absicht)
#   2. Container bauen, testen, in Betrieb nehmen
#   3. docker exec <container> pip freeze > app/requirements.lock  (das Ergebnis)
#   4. pytest — tests/test_abhaengigkeiten.py prueft, dass beide Dateien
#      dieselben Fassungen nennen
#
# Diese Datei NICHT von Hand bearbeiten. Sie ist ein Abbild, keine Absicht.

