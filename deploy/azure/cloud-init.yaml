#cloud-config
# EXO Signature Gateway — Erstinstallation auf einer frischen Debian-12-VM.
#
# ⚠️ EINZIGE QUELLE. Diese Datei wird benutzt von
#   - azure-vm-setup.ps1 (liest sie und übergibt sie als --custom-data) und
#   - deploy/azure/azuredeploy.json (eingebettet, erzeugt von
#     tools/azure-vorlage.py — nicht von Hand ändern).
# Nach einer Änderung hier: python3 tools/azure-vorlage.py --fix
# Platzhalter: __ADMIN_USER__ (SSH-Benutzer), __REPO_URL__ (Git-Repository).
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - openssl

runcmd:
  # Docker installieren
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker __ADMIN_USER__
  - systemctl enable docker
  # Repository klonen
  - git clone __REPO_URL__ /opt/exo-gateway
  - chown -R __ADMIN_USER__:__ADMIN_USER__ /opt/exo-gateway
  # .env: nur der Sitzungsschlüssel der Oberfläche. Alles Weitere setzt der
  # Einrichtungsassistent in data/settings.json.
  - |
    cat > /opt/exo-gateway/.env << ENVEOF
    WEBUI_SECRET_KEY=$(openssl rand -hex 32)
    ENVEOF
  - chown __ADMIN_USER__:__ADMIN_USER__ /opt/exo-gateway/.env
  - chmod 600 /opt/exo-gateway/.env
  # Bind-Mount-Verzeichnisse dem Container-User (appuser, UID 1000) übereignen.
  # Sonst legt der Docker-Daemon sie beim ersten Mount als root an, und der als
  # appuser laufende Container crasht mit PermissionError.
  - mkdir -p /opt/exo-gateway/data /opt/exo-gateway/certs /opt/exo-gateway/templates
  - chown -R 1000:1000 /opt/exo-gateway/data /opt/exo-gateway/certs /opt/exo-gateway/templates
  # Anfangskennwort der Weboberfläche. Die Azure-Vorlage übergibt es
  # verschlüsselt über eine Custom-Script-Erweiterung, die es nach
  # /etc/exo-gateway/webui-kennwort schreibt — nicht über diese Datei (Custom
  # Data), von der Microsoft für Geheimnisse abrät. Bis es da ist, startet das
  # Gateway nicht; sonst wäre es so lange mit admin/admin erreichbar.
  # __KENNWORT_WARTEN__ = Sekunden; 0 = kein Kennwort erwartet (azure-vm-setup.ps1,
  # dort erzwingt der Einrichtungsassistent das Ändern von admin/admin).
  - |
    f=/etc/exo-gateway/webui-kennwort; n=0
    while [ ! -s "$f" ] && [ "$n" -lt __KENNWORT_WARTEN__ ]; do sleep 5; n=$((n+5)); done
    if [ -s "$f" ]; then
      printf "WEBUI_PASSWORD='%s'\n" "$(cat "$f")" >> /opt/exo-gateway/.env
      rm -f "$f"
    elif [ __KENNWORT_WARTEN__ -gt 0 ]; then
      echo "exo-gateway: kein Anfangskennwort erhalten, Gateway wird nicht gestartet" >&2
      exit 1
    fi
  # Gateway bauen und starten (es gibt kein vorgebautes Image)
  - cd /opt/exo-gateway && docker compose up -d --build
  # Update-Watcher (Update-Knopf in der Oberfläche) — dasselbe Skript wie auf
  # jedem anderen Host, keine eigene Fassung der systemd-Unit.
  - bash /opt/exo-gateway/install-update-watcher.sh
