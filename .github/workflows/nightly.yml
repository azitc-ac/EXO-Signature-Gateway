# Nightly: täglich 23:59 (Europe/Berlin) rückt der Zweig `nightly` auf den
# jüngsten main-Stand vor, dessen CI grün war (Auswahl: tools/nightly_stand.py).
# Installationen im Update-Kanal „Nightly“ beziehen genau diesen Zweig
# (update-watcher.sh, update_core.KANAELE).
#
# Nur vorwärts: `git push` ohne --force. Läge der gewählte Stand nicht vor dem
# bisherigen, lehnt GitHub ab und der Lauf wird rot — main wird nie umgeschrieben,
# also ist das ein Fehler, den man sehen soll.
#
# Zwei Startzeiten (UTC), weil cron keine Zeitzone kennt: 22:15 und 23:15 UTC
# liegen im Winter bei 23:15/00:15, im Sommer bei 00:15/01:15 Berlin — mindestens
# einer immer nach 23:59. Doppelte Läufe ändern nichts (gleiche Auswahl).

name: Nightly

on:
  schedule:
    - cron: "15 22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Grünen Stand vor 23:59 bestimmen
        id: wahl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > laeufe.json
          sha=$(python3 tools/nightly_stand.py < laeufe.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Gewählt: ${sha:-keiner}"

      - name: Zweig nightly vorrücken
        if: steps.wahl.outputs.sha != ''
        run: |
          alt=$(git ls-remote origin refs/heads/nightly | cut -f1)
          neu=${{ steps.wahl.outputs.sha }}
          if [ "$alt" = "$neu" ]; then echo "nightly steht schon auf $neu"; exit 0; fi
          git push origin "$neu:refs/heads/nightly"
          echo "nightly: ${alt:-neu} -> $neu"
