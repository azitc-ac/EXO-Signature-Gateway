# Fortlaufende Prüfung bei jedem Push und Pull Request.
#
# Warum das hier steht: Bis zum 26.07.2026 gab es keine Testsuite und keine CI.
# Alles, was "geprüft" hiess, waren Einweg-Skripte, die danach verschwanden.
# Diese Datei sorgt dafür, dass die Prüfungen unabhängig davon laufen, ob
# jemand daran denkt — und auf einem sauberen Rechner ohne .env, ohne Container
# und ohne die gewachsene settings.json der Entwicklungsmaschine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests und Prüfskripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # dieselbe Fassung wie im Container

      - uses: actions/setup-node@v4   # für tools/jsscopecheck.js
        with:
          node-version: "20"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Aus der LOCK-Datei, nicht aus requirements.txt: sonst prueft die CI
          # gegen einen anderen Abhaengigkeitsbaum als den, der im Container
          # laeuft. Am 09.08.2026 unterschied sich allein Starlette zwischen
          # CI (1.6.0) und Produktivsystem (1.4.0) — und genau dort lag ein
          # Verhaltensunterschied bei der Routen-Registrierung.
          pip install -r app/requirements.lock
          (cd tools && npm ci)        # nur acorn, exakt gepinnt (tools/package-lock.json)

      - name: Tests
        run: pytest tests/ -v

      # driftcheck vergleicht normalerweise Gateway UND Hub. Das Hub-Repo ist
      # privat und hier nicht ausgecheckt — deshalb der eingeschränkte Modus,
      # der nur die Gateway-Prüfungen fährt. Die Spiegelung der gemeinsamen
      # Dateien wird beim Hub-Lauf geprüft, wo beide Bäume vorliegen.
      # Das EXO SMTP Relay fuehrt gespiegelte Kopien von smtp_relay.py,
      # relay_hosts.py, secure_io.py u.a. Hier faellt auf, wenn das RELAY eine
      # davon geaendert hat; die Gegenrichtung prueft das Relay naechtlich.
      # Ausgecheckt und gleich wieder entfernt, damit die folgenden Pruefungen
      # (darkcheck, routencheck, …) nicht in den fremden Baum laufen.
      #
      # Zugriff: Ist das Relay-Repo oeffentlich, reicht das eingebaute Token.
      # Ist es privat, braucht dieses Repo das Secret RELAY_TOKEN (Fine-grained
      # PAT, nur azitc-ac/exo-smtp-relay, Contents: Read-only) — das Token
      # eines Repos sieht kein anderes privates Repo, auch nicht in derselben
      # Organisation ("Not Found" beim Auschecken).
      - name: EXO SMTP Relay auschecken
        uses: actions/checkout@v4
        with:
          repository: azitc-ac/exo-smtp-relay
          path: relay-repo
          token: ${{ secrets.RELAY_TOKEN || github.token }}

      - name: Drift-Prüfung (Gateway und Relay-Spiegelung)
        run: |
          python tools/driftcheck.py --gateway-only --relay relay-repo
          rm -rf relay-repo

      - name: Dark Mode
        run: python tools/darkcheck.py app/webui/templates app/webui/static/dark-mode.css

      # Eine erfundene CSS-Klasse tut NICHTS — kein Fehler, keine Meldung, nur
      # fehlende Darstellung. Weder jscheck noch darkcheck sehen das.
      - name: CSS-Klassen
        run: python tools/cssklassencheck.py

      # Eine Einstellungszeile hat genau zwei zulaessige Formen. Ohne diese
      # Pruefung entstand mit jeder Layoutkorrektur eine neue Abweichung.
      - name: Aufbau der Einstellungszeilen
        run: python tools/zeilencheck.py

      # Breite Tabellen brauchen einen rollbaren Bereich UND eine Mindestbreite.
      # Ohne das sind Knoepfe in der rechten Spalte auf dem Telefon nicht
      # erreichbar — gemessen: Knopf bei x=896 in einem 393px breiten Fenster.
      - name: Tabellen auf schmalen Schirmen
        run: python tools/tabellencheck.py

      - name: JavaScript der Vorlagen
        run: python tools/jscheck.py

      # jscheck prüft die Syntax; diese Prüfung findet Bezeichner, die zur
      # Laufzeit nirgends aufgelöst werden — syntaktisch einwandfrei, im
      # Browser ein ReferenceError. Solche Fehler landen typischerweise in
      # einem catch-Zweig und erscheinen dort als Meldung, die auf das
      # Falsche zeigt ("Container wird neu gestartet…", "Nutzungsbedingungen
      # konnten nicht geladen werden").
      - name: Ungebundene Bezeichner im Vorlagen-JavaScript
        run: node tools/jsscopecheck.js app/webui/templates app/webui/static/common.js app/webui/static/sig_preview.js

      # Die Gegenrichtung zu jsscopecheck: dort Verweis ohne Ziel, hier Ziel
      # ohne Verweis. Beides ist lauffähiges JavaScript, das keine der übrigen
      # Prüfungen beanstandet. Eingeschränkt, weil eine gespiegelte Funktion
      # durchaus nur in der anderen Anwendung benutzt sein kann; die
      # vollständige Prüfung über beide Bäume läuft beim Hub.
      - name: Unbenutzte Funktionen (nur Gateway)
        run: python tools/deadcheck.py --gateway-only

      # Dieselbe Gegenrichtung eine Ebene hoeher: jsscopecheck findet
      # Bedienelemente ohne Funktion, dies hier Endpunkte ohne Bedienelement.
      # Ein Endpunkt sieht durch seinen Dekorator immer benutzt aus, und
      # deadcheck prueft ausdruecklich nur JavaScript. Erster Lauf: vier tote
      # Endpunkte, darunter eine zweite, abweichende Changelog-Auswertung neben
      # der tatsaechlich benutzten.
      - name: Endpunkte ohne Aufrufer
        run: python tools/routencheck.py

      # Prueft die SPRACHE, nicht das Verhalten: dasselbe Ding trug im
      # 587-Fall vier Namen (smtp587 / „IMAP + Graph" / „587-Modus" — den es
      # nicht gibt). Ausgenommen sind Vergleiche im Code (Bestandsanlagen
      # tragen den Altnamen) und Stellen, die den Begriff gerade erklaeren.
      - name: Begriffe einheitlich
        run: python tools/begriffecheck.py

  build:
    name: Container baut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Faengt ab, was lokal nur deshalb laeuft, weil es schon im Image liegt —
      # etwa ein Paket, das in requirements.txt fehlt.
      - name: Docker build
        run: docker build -t exo-signature-gateway:ci .
